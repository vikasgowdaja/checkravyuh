name: checkravyuh_mobile
description: Checkravyuh mobile client.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.3
  dio: ^5.7.0
  drift: ^2.20.3
  freezed_annotation: ^2.4.4
